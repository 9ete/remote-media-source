<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
	* { margin: 0; padding: 0; box-sizing: border-box; }
	body { width: 1544px; height: 500px; overflow: hidden; }
	.banner {
		width: 1544px; height: 500px;
		background: linear-gradient(135deg, #131c26 0%, #1d2c3e 55%, #24384e 100%);
		font-family: "Avenir Next", "Helvetica Neue", Helvetica, Arial, sans-serif;
		position: relative;
		color: #fff;
	}
	.copy { position: absolute; left: 84px; top: 150px; max-width: 820px; }
	h1 { font-size: 64px; font-weight: 600; letter-spacing: -0.5px; }
	h1 .dim { color: #4aa3df; }
	p { margin-top: 22px; font-size: 27px; line-height: 1.45; color: #9fb3c8; font-weight: 400; }
	.diagram { position: absolute; right: 90px; top: 110px; width: 420px; height: 280px; }
	svg { display: block; }
</style>
</head>
<body>
<div class="banner">
	<div class="copy">
		<h1>Remote Media <span class="dim">Source</span></h1>
		<p>Serve production media on local, dev &amp; staging environments — without syncing a single file.</p>
	</div>
	<div class="diagram">
		<svg width="420" height="280" viewBox="0 0 420 280" xmlns="http://www.w3.org/2000/svg">
			<!-- consumer nodes -->
			<g stroke="#7f93a8" stroke-width="2" fill="rgba(74,163,223,0.08)">
				<rect x="8"  y="10"  width="96" height="64" rx="8"/>
				<rect x="8"  y="108" width="96" height="64" rx="8"/>
				<rect x="8"  y="206" width="96" height="64" rx="8"/>
			</g>
			<g fill="#7f93a8" font-family="Helvetica, Arial, sans-serif" font-size="13">
				<text x="24" y="48">local</text>
				<text x="24" y="146">dev</text>
				<text x="24" y="244">staging</text>
			</g>
			<!-- connections -->
			<g stroke="#4aa3df" stroke-width="2.5" fill="none" stroke-dasharray="7 6">
				<path d="M104 42  C 170 42, 175 140, 230 140"/>
				<path d="M104 140 L 230 140"/>
				<path d="M104 238 C 170 238, 175 140, 230 140"/>
			</g>
			<!-- source node -->
			<rect x="230" y="55" width="182" height="170" rx="14" stroke="#4aa3df" stroke-width="3" fill="rgba(74,163,223,0.13)"/>
			<!-- photo glyph -->
			<rect x="262" y="92" width="118" height="96" rx="8" stroke="#ffffff" stroke-width="4" fill="none"/>
			<circle cx="292" cy="120" r="10" fill="#ffffff"/>
			<path d="M270 180 L 312 132 L 334 156 L 352 136 L 372 180 Z" fill="#ffffff"/>
			<text x="268" y="214" fill="#9fb3c8" font-family="Helvetica, Arial, sans-serif" font-size="13">production</text>
		</svg>
	</div>
</div>
</body>
</html>
